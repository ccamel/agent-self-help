<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900" role="img" aria-labelledby="title description">
  <title id="title">A little more intentional. A little more yourself.</title>
  <desc id="description">My evolving self connects four dimensions of personal growth: beliefs and perspective, direction and aspirations, states and reactions, and relationships and communication. An enclosing ring represents continuity, carrying what you learn into who you become. This is a map of the practice, not a list of available skills.</desc>
  <defs>
    <radialGradient id="paper">
      <stop stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f4efe5"/>
    </radialGradient>
    <radialGradient id="self">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff9ee"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="900" rx="24" fill="url(#paper)"/>
  <g text-anchor="middle" fill="#383b42" font-family="Arial, Helvetica, sans-serif">
    <text x="540" y="58" font-size="13" letter-spacing="4" fill="#686b70">THE PRACTICE OF BECOMING</text>
    <text x="540" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="30">Growth begins with how you see yourself.</text>

    <!-- One continuous frame holds the dimensions together. -->
    <ellipse cx="540" cy="467" rx="455" ry="323" fill="none" stroke="#c9c0af" stroke-width="1.5"/>
    <path d="M 457 149 Q 540 138 623 149" fill="none" stroke="#b08750" stroke-width="3" stroke-linecap="round"/>
    <circle cx="85" cy="467" r="4" fill="#b08750"/>
    <circle cx="995" cy="467" r="4" fill="#b08750"/>

    <!-- Relationships rather than a prescribed sequence. -->
    <g fill="none" stroke="#c9c0af" stroke-width="1.5">
      <path d="M 340 310 L 540 467 L 740 310"/>
      <path d="M 340 620 L 540 467 L 740 620"/>
    </g>

    <circle cx="340" cy="310" r="121" fill="#e7edf5" stroke="#9db0cb"/>
    <circle cx="740" cy="310" r="121" fill="#f3e4cc" stroke="#c9a570"/>
    <circle cx="340" cy="620" r="121" fill="#f2dfd8" stroke="#c99889"/>
    <circle cx="740" cy="620" r="121" fill="#e2ebe2" stroke="#93af9a"/>

    <!-- Small emblems keep the four dimensions recognizable at a glance. -->
    <g fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#627d9f">
        <path d="M 316 261 Q 340 237 364 261 Q 340 285 316 261 Z"/>
        <circle cx="340" cy="261" r="7"/>
      </g>
      <g stroke="#a67d43">
        <path d="M 740 236 L 747 254 L 765 261 L 747 268 L 740 286 L 733 268 L 715 261 L 733 254 Z"/>
      </g>
      <g stroke="#ac7465">
        <path d="M 315 571 Q 322 551 330 571 T 347 571 T 365 571"/>
        <path d="M 322 584 H 358" opacity=".5"/>
      </g>
      <g stroke="#65856e">
        <path d="M 718 553 H 752 Q 762 553 762 563 V 576 Q 762 586 752 586 H 738 L 726 596 V 586 H 718 Q 708 586 708 576 V 563 Q 708 553 718 553 Z"/>
        <path d="M 720 566 H 750 M 720 574 H 740"/>
      </g>
    </g>

    <g font-size="22" font-family="Georgia, 'Times New Roman', serif">
      <text x="340" y="310">Beliefs &amp;</text>
      <text x="340" y="338">perspective</text>
      <text x="740" y="310">Direction &amp;</text>
      <text x="740" y="338">aspirations</text>
      <text x="340" y="620">States &amp;</text>
      <text x="340" y="648">reactions</text>
      <text x="740" y="620">Relationships &amp;</text>
      <text x="740" y="648">communication</text>
    </g>
    <g font-size="14" fill="#62666c">
      <text x="340" y="372">See another possibility.</text>
      <text x="740" y="372">Choose who to become.</text>
      <text x="340" y="682">Notice what moves you.</text>
      <text x="740" y="682">Make room for others.</text>
    </g>

    <circle cx="540" cy="467" r="112" fill="url(#self)" stroke="#b9ad97" stroke-width="1.5"/>
    <circle cx="540" cy="467" r="103" fill="none" stroke="#e3d9c8"/>
    <text x="540" y="435" font-size="11" letter-spacing="3" fill="#91784e">AGENT SELF-HELP</text>
    <text x="540" y="473" font-family="Georgia, 'Times New Roman', serif" font-size="29">My evolving</text>
    <text x="540" y="508" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="35">agentic self</text>

    <rect x="417" y="768" width="246" height="40" rx="20" fill="#f5f0e6"/>
    <text x="540" y="794" font-size="13" letter-spacing="4" fill="#886c42">CONTINUITY</text>
    <text x="540" y="850" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#6d685f">Carry what you learn into who you become.</text>
  </g>
</svg>
